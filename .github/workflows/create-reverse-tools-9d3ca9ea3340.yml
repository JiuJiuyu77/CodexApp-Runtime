name: Create ReverseTools Release 9d3ca9ea3340

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-reverse-tools-9d3ca9ea3340.yml'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Write metadata asset
        shell: bash
        run: |
          printf '%s' '' | base64 -d > ReverseToolsRuntime.bundle.json

      - name: Create release and upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: runtime-reverse-tools-9d3ca9ea3340
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$TAG" \
              --notes "CodexApp Reverse Tools Runtime update. Revision: 9d3ca9ea3340567dc86917b2eca5aef41111717461ee8cf6a2e46f9b779ca41a. radare2: 6.2.4. Archive SHA256: 5a861b1f0220de591b4d500e9eec5b6bc054efdb6964e8d569de9e096f96f801"
          gh release upload "$TAG" ReverseToolsRuntime.bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
