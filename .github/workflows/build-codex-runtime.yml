name: Build Codex Runtime

on:
  push:
    branches:
      - main
    paths:
      - "Runtime/Codex/**"
      - ".github/workflows/build-codex-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Check out runtime repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install packaging tools
        run: |
          brew install ldid dpkg
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-apple-ios

      - name: Prepare Codex packaging source
        id: meta
        run: |
          version="$(tr -d '[:space:]' < Runtime/Codex/package-version.txt)"
          packaging_ref="$(tr -d '[:space:]' < Runtime/Codex/packaging-ref.txt)"
          base_version="${version%%-*}"
          test -n "$version"
          test -n "$packaging_ref"
          test -n "$base_version"

          git clone https://github.com/owngoal-dev/codex.git build/codex-packaging
          git -C build/codex-packaging checkout --detach "$packaging_ref"

          cp Runtime/Codex/0005-ios-native-posix-spawn.patch \
             build/codex-packaging/patches/0005-ios-native-posix-spawn.patch
          cp Runtime/Codex/0006-ios-poll-native-child-exit.patch \
             build/codex-packaging/patches/0006-ios-poll-native-child-exit.patch

          make -C build/codex-packaging set-version VERSION="$version"
          make -C build/codex-packaging check
          make -C build/codex-packaging source

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "tag=runtime-codex-v$version" >> "$GITHUB_OUTPUT"

      - name: Build patched Codex CLI only
        run: |
          repo="$GITHUB_WORKSPACE/build/codex-packaging"
          source "$repo/configuration/upstream.env"

          src="$repo/build/src"
          cargo_root="$src/$CARGO_DIR"
          scratch="$repo/build/codex-hotfix"
          rust_target="aarch64-apple-ios"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"

          toolchain_rustc="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          export PATH="$(dirname "$toolchain_rustc"):$PATH"
          export SDKROOT="$sdk_path"
          export IPHONEOS_DEPLOYMENT_TARGET="$MIN_IOS"
          unset MACOSX_DEPLOYMENT_TARGET
          export PKG_CONFIG_ALLOW_CROSS=1
          unset PKG_CONFIG_PATH PKG_CONFIG_LIBDIR || true

          mkdir -p "$scratch/cargo-home"
          export CARGO_HOME="$scratch/cargo-home"
          export CARGO_TARGET_DIR="$scratch/target"
          export RUSTFLAGS="--remap-path-prefix=$src=/src --remap-path-prefix=$scratch=/build"

          (
            cd "$cargo_root"
            rustup run "$RUST_TOOLCHAIN" cargo build \
              --release \
              --target "$rust_target" \
              --package "$CARGO_PACKAGE" \
              --bin "$CARGO_BIN"
          )

          binary="$CARGO_TARGET_DIR/$rust_target/release/$CARGO_BIN"
          test -s "$binary"
          vtool -show-build "$binary" | grep -qE '^ *platform (IOS|2)$'
          test "$(lipo -archs "$binary")" = "$ARCH"

      - name: Reuse matching official Code Mode host
        run: |
          version="${{ steps.meta.outputs.version }}"
          base_version="${{ steps.meta.outputs.base_version }}"
          repo="$GITHUB_WORKSPACE/build/codex-packaging"
          source "$repo/configuration/upstream.env"

          upstream="$repo/build/upstream-runtime"
          mkdir -p "$upstream"
          deb="wiki.qaq.codex_${base_version}_iphoneos-arm64.deb"
          base_url="https://github.com/owngoal-dev/codex/releases/download/v${base_version}"

          curl --fail --location --retry 3 --output "$upstream/$deb" "$base_url/$deb"
          curl --fail --location --retry 3 --output "$upstream/SHA256SUMS" "$base_url/SHA256SUMS"
          (
            cd "$upstream"
            grep -F "  $deb" SHA256SUMS > SHA256SUMS.rootless
            shasum -a 256 -c SHA256SUMS.rootless
          )

          dpkg-deb -x "$upstream/$deb" "$upstream/rootfs"
          host="$upstream/rootfs/var/jb/usr/libexec/$PROGRAM/$CODE_MODE_HOST_BIN"
          test -s "$host"
          vtool -show-build "$host" | grep -qE '^ *platform (IOS|2)$'

          payload="$repo/build/codex-hotfix/payload"
          rm -rf "$payload"
          mkdir -p "$payload"

          codex="$repo/build/codex-hotfix/target/aarch64-apple-ios/release/$CARGO_BIN"
          /usr/bin/ditto "$codex" "$payload/$CARGO_BIN"
          /usr/bin/ditto "$host" "$payload/$CODE_MODE_HOST_BIN"

          xcrun --sdk iphoneos strip -xS "$payload/$CARGO_BIN"
          chmod 0755 "$payload/$CARGO_BIN" "$payload/$CODE_MODE_HOST_BIN"

          echo "payload=$payload" >> "$GITHUB_ENV"

      - name: Package rootless CodexApp runtime
        run: |
          version="${{ steps.meta.outputs.version }}"
          repo="$GITHUB_WORKSPACE/build/codex-packaging"
          packages="$repo/build/Packages"
          mkdir -p "$packages"

          "$repo/scripts/package-deb.sh" \
            "$payload" \
            "$packages/wiki.qaq.codex_${version}_iphoneos-arm64.deb" \
            "$version" \
            "iphoneos-arm64" \
            "/var/jb"

          (
            cd "$packages"
            shasum -a 256 "wiki.qaq.codex_${version}_iphoneos-arm64.deb" > SHA256SUMS
          )

      - name: Verify expected CodexApp asset
        run: |
          version="${{ steps.meta.outputs.version }}"
          package="build/codex-packaging/build/Packages/wiki.qaq.codex_${version}_iphoneos-arm64.deb"
          test -s "$package"
          grep -F "wiki.qaq.codex_${version}_iphoneos-arm64.deb" \
            build/codex-packaging/build/Packages/SHA256SUMS
          dpkg-deb -I "$package" | sed 's/^/    /'

      - name: Publish namespaced runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          base_version="${{ steps.meta.outputs.base_version }}"
          tag="${{ steps.meta.outputs.tag }}"
          packages="build/codex-packaging/build/Packages"

          cat > /tmp/codex-runtime-notes.md <<EOF
          CodexApp iOS runtime package revision v${version}.

          OpenAI Codex version: v${base_version}
          Runtime fixes:
          - use Codex's native Apple posix_spawn backend on iOS so unified exec does not fall back to fork/pre_exec on pure TrollStore;
          - poll waitpid on iOS when Tokio SIGCHLD delivery is unavailable, so completed commands reach their terminal state and return exit status instead of remaining "running".
          The codex-code-mode-host sidecar is reused byte-for-byte from the verified upstream v${base_version} rootless package and is re-signed by the original packaging pipeline.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Codex Runtime v${version}" \
              --notes-file /tmp/codex-runtime-notes.md \
              --prerelease
            gh release upload "$tag" "$packages"/*.deb "$packages"/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Codex Runtime v${version}" \
              --notes-file /tmp/codex-runtime-notes.md \
              --prerelease \
              "$packages"/*.deb "$packages"/SHA256SUMS
          fi
