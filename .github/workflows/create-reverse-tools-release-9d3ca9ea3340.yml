name: Create ReverseTools Release 9d3ca9ea3340

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-reverse-tools-release-9d3ca9ea3340.yml"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="runtime-reverse-tools-9d3ca9ea3340"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title "$TAG" --notes "CodexApp Reverse Tools Runtime update. Expected asset: ReverseToolsRuntime.tar.gz; expected bytes: 17376078; SHA256: 5a861b1f0220de591b4d500e9eec5b6bc054efdb6964e8d569de9e096f96f801."
